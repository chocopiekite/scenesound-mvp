<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SceneSound · 내 컴퓨터 연결</title><link rel="stylesheet" href="/studio/studio.css"><script src="/studio/connect.js" defer></script></head><body><header><a href="https://scenesound-mvp.vercel.app/" class="brand">SceneSound</a></header><main style="max-width:720px"><section class="panel"><p class="eyebrow">LOCAL PROCESSING</p><h1>큰 AAF는 이 컴퓨터에서.</h1><p>공개 웹 화면을 조작하고, AAF 분석과 결과 만들기는 이 컴퓨터가 담당해요. AAF를 외부 처리 서버로 보내지 않아요.</p><p class="note">이 브라우저에 24시간 연결 권한을 줘요. 서버를 다시 시작하면 재연결이 필요해요. 파일 처리와 다운로드가 끝날 때까지 서버를 켜 두세요.</p><button id="connect-local" class="primary">연결하고 웹으로 돌아가기</button><p id="connect-state" class="note" role="status"></p><p><a id="open-local" href="/dialogue.html">이 컴퓨터의 화면에서 바로 작업하기</a></p><p class="note">웹에서 로컬 네트워크 접근을 물으면 허용해 주세요. 브라우저가 연결을 지원하지 않으면 위 로컬 화면에서 동일한 기능을 사용할 수 있어요.</p></section></main></body></html>
